[package]
authors = { workspace = true }
categories = { workspace = true }
description = { workspace = true }
documentation = { workspace = true }
edition = { workspace = true }
keywords = { workspace = true }
license = { workspace = true }
name = "envstruct"
readme = { workspace = true }
repository = { workspace = true }
resolver = "2"
version = { workspace = true }

[features]
bytesize = ["dep:bytesize"]
chrono = ["dep:chrono"]
default = [
    "bytesize",
    "chrono",
    "humantime",
    "regex",
    "serde_json",
    "url",
    "env_uppercase",
]
env_uppercase = []
humantime = ["dep:humantime"]
regex = ["dep:regex"]
serde_json = ["dep:serde_json", "dep:serde"]
url = ["dep:url"]

[dependencies]
bytesize = { version = "2", optional = true }
chrono = { version = "0.4", optional = true }
envstruct_derive = { path = "../envstruct_derive", version = "1.0" }
humantime = { version = "2", optional = true }
pastey = "0.2"
regex = { version = "1", optional = true }
serde = { version = "1", optional = true }
serde_json = { version = "1", optional = true }
thiserror = "2"
url = { version = "2", optional = true }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serial_test = "4.0"
strum = { version = "0.28", features = ["derive"] }
trybuild = "1.0.121"

[[example]]
name = "usage"
path = "example/usage.rs"

[[example]]
name = "basic"
path = "example/basic.rs"

[[example]]
name = "usage_groups"
path = "example/usage_groups.rs"
